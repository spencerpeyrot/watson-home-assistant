# Append to /etc/asound.conf. Voice and timer must both use cube_speaker.
# Keep capture on plughw:CARD=seeed2micvoicec,DEV=0.
pcm.cube_speaker_mix {
    type dmix
    ipc_key 4282026
    ipc_key_add_uid true
    ipc_perm 0600
    slave {
        pcm "hw:CARD=seeed2micvoicec,DEV=0"
        format S16_LE
        rate 48000
        channels 2
        period_size 960
        buffer_size 3840
    }
    bindings {
        0 0
        1 1
    }
}

pcm.cube_speaker {
    type plug
    slave.pcm "cube_speaker_mix"
    hint.description "Cube shared HAT speaker"
}
